# Offline CI: lint, all six adapters through the same eval suite, real test count, doc drift,
# brand check and a full-history secret scan. No API keys, no cloud. Actions pinned to commit SHAs.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BAKEOFF_REQUIRE_ALL: "1"
      CREWAI_TRACING_ENABLED: "false"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: One pinned env per framework
        run: scripts/make_envs.sh
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (every adapter must run; missing env fails)
        run: pytest -q
      - name: Test count (printed, not swallowed)
        run: python scripts/count_tests.py
      - name: Bake-off
        run: bakeoff demo
      - name: README and docs numbers match a fresh run
        run: python scripts/render_docs.py --check
      - name: Brand check (hashed blocklist)
        run: python scripts/check_brands.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
